name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified site (public; Pages must already be enabled)
        type: boolean
        required: true
        default: false
      indexable:
        description: Allow search indexing for this public launch
        type: boolean
        required: true
        default: false

# A push or pull request only runs checks. Deployment is an explicit manual action.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        base_path: ['/', '/pages-path-check/']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        id: firefox
        with:
          firefox-version: latest
      - run: python -m pip install -r requirements.txt
      - name: Static fidelity, Pages packaging and four browser modes
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
          BASE_PATH: ${{ matrix.base_path }}
        run: make check-pages PAGES_ARGS="--base-path $BASE_PATH"
      - name: Retain QA evidence (never part of the website)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-${{ strategy.job-index }}
          path: qa-reports/
          retention-days: 7

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        id: firefox
        with:
          firefox-version: latest
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
        with:
          enablement: false
      - run: python -m pip install -r requirements.txt
      - name: Build for the actual Pages URL and indexing choice
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          INDEXABLE: ${{ inputs.indexable }}
        shell: bash
        run: |
          args=(--site-url "$PAGES_URL")
          if [[ "$INDEXABLE" == 'true' ]]; then args+=(--indexable); fi
          python pages.py "${args[@]}"
          python -m unittest -q test_verify test_pages
      - name: Exercise the exact deployment package
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          node browser-qa.mjs --pages
          node browser-qa.mjs --pages --dark
          node browser-qa.mjs --pages --no-js
          node browser-qa.mjs --pages --no-js --dark
          python pages.py --verify-only
      - name: Upload only the allowlisted web root
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/pages

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
